[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbox"
version = "0.1.0"
description = "Django Chat Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<6.0",
    "dj-database-url>=2.1.0",
    "django-environ>=0.11.0",
    "whitenoise>=6.6.0",
    "cloudinary>=1.38.0",
    "django-cloudinary-storage>=0.3.0",
    "django-allauth>=0.61.0",
    "Pillow>=10.2.0",
    "psycopg2-binary>=2.9.9",
    "channels>=4.0.0",
    "daphne>=4.1.0",
    "channels-redis>=4.2.0",
    "django-cleanup>=8.0.0",
    "django-htmx>=1.17.0",
    "django-browser-reload>=1.12.0",
    "shortuuid>=1.0.11",
    "gunicorn>=26.2.0",
]
